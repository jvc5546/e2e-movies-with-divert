{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rent
    component: api
  name: rent
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: rent
      component: api
  template:
    metadata:
      labels:
        app: rent
        component: api
    spec:
      containers:
      - image: {{ .Values.api.image }}
        name: rent
        ports:
        - containerPort: 8080
          name: rent
        env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.api.kafkaBootstrapServers | quote }}
{{- end }}