icon: https://apps.okteto.com/movies/icon.png

# Deploys only the subset of services that's safe to share across every
# developer: catalog (read-only reference data) and Kafka (the event bus).
# Personal namespaces (see okteto.personal.yaml) deploy the rest and divert
# catalog + Kafka from here.

build:
  catalog:
    context: catalog
  tests:
    context: tests

deploy:
  - name: Deploy Catalog
    command: helm upgrade --install catalog catalog/chart --set image=${OKTETO_BUILD_CATALOG_IMAGE}
  - name: Deploy Rentals (Kafka only)
    command: >-
      helm upgrade --install rentals rentals/chart
      --set kafka.enabled=true
      --set postgresql.enabled=false
      --set api.enabled=false
      --set worker.enabled=false

test:
  e2e:
    image: ${OKTETO_BUILD_TESTS_IMAGE}
    context: tests
    caches:
      - yarn/.cache
      - node_modules
    commands:
      - yarn install
      - yarn test --grep @subset
    artifacts:
      - test-results
      - playwright-report
